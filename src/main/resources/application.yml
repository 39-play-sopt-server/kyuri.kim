spring:
  application:
    name: assignment

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/assignment}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  forward-headers-strategy: framework

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}